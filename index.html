<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEURON // Asset Tracker</title>

  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Fonts: Space Grotesk for that technical, character-rich vibe -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================= CORE THEME & VARIABLES ================= */
    :root {
      --bg-color: #050505;
      --neon-green: #00ff66;
      --neon-blue: #00e5ff;
      --neon-pink: #ff0055;
      --panel-bg: rgba(15, 15, 15, 0.8);
      --grid-color: rgba(0, 255, 102, 0.03);
    }

    body {
      background-color: var(--bg-color);
      color: #e0e0e0;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      /* CRT Grid Background */
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Scanline Overlay Effect */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* ================= COMPONENT STYLES ================= */
    .terminal-panel {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 255, 102, 0.15);
      backdrop-filter: blur(10px);
      position: relative;
      transition: all 0.3s ease;
    }
    
    .terminal-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 10px; height: 10px;
      border-top: 2px solid var(--neon-green);
      border-left: 2px solid var(--neon-green);
    }
    
    .terminal-panel::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 10px; height: 10px;
      border-bottom: 2px solid var(--neon-green);
      border-right: 2px solid var(--neon-green);
    }

    .asset-node {
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    .asset-node:hover {
      background: rgba(0, 255, 102, 0.05);
      border-left: 3px solid var(--neon-green);
      transform: translateX(5px);
    }

    /* Glowing Text Classes */
    .glow-green { text-shadow: 0 0 10px rgba(0, 255, 102, 0.6); color: var(--neon-green); }
    .glow-red { text-shadow: 0 0 10px rgba(255, 0, 85, 0.6); color: var(--neon-pink); }
    .glow-blue { text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); color: var(--neon-blue); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 255, 102, 0.3); }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

    /* Ticker Animation */
    .ticker-wrap {
      width: 100%;
      overflow: hidden;
      background: rgba(0, 255, 102, 0.05);
      border-top: 1px solid rgba(0, 255, 102, 0.2);
      border-bottom: 1px solid rgba(0, 255, 102, 0.2);
    }
    .ticker {
      display: inline-block;
      white-space: nowrap;
      animation: ticker-scroll 30s linear infinite;
    }
    @keyframes ticker-scroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* Glitch Animation */
    @keyframes glitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }
    .glitch-hover:hover { animation: glitch 0.2s ease-in-out infinite; }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen flex flex-col z-10 relative">

  <!-- ================= TOP STATUS BAR & GOOGLE SHEETS SYNC ================= -->
  <header class="w-full flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 terminal-panel p-4 z-20">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse" id="sys-status-led"></div>
      <h1 class="text-2xl font-bold tracking-widest glow-green uppercase">NEURON // SYSTEM</h1>
    </div>

    <div class="flex items-center gap-3 w-full md:w-auto">
      <div class="text-xs text-gray-500 font-mono tracking-widest uppercase hidden md:block" id="sys-log">
        SYS.STATE: OFFLINE_DEMO
      </div>
      
      <!-- Google Sheets Connection Terminal -->
      <div class="flex bg-black border border-green-500/30 p-1 w-full md:w-64">
        <span class="text-green-500 px-2 flex items-center font-bold">></span>
        <input type="password" id="sheet-passcode" placeholder="ENTER SYNC KEY..." onkeypress="handleKey(event)"
               class="bg-transparent text-green-400 text-sm focus:outline-none w-full font-mono placeholder-green-900 tracking-widest">
        <button onclick="syncGoogleSheet()" id="sync-btn" class="bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-black transition px-3 py-1 text-xs font-bold uppercase tracking-wider">
          SYNC
        </button>
      </div>
    </div>
  </header>

  <!-- ================= LIVE ASSET TICKER ================= -->
  <div class="ticker-wrap mb-8 z-20">
    <div class="ticker py-2 text-sm font-bold tracking-widest" id="ticker-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- ================= MAIN DASHBOARD GRID ================= -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 z-20 relative">
    
    <!-- LEFT COLUMN: WEALTH & ANALYTICS -->
    <div class="lg:col-span-8 flex flex-col gap-6">
      
      <!-- KPI Row -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        <div class="terminal-panel p-6 flex flex-col justify-center">
          <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-800 pb-1">Net Liquidity</span>
          <h2 class="text-4xl md:text-5xl font-bold glow-green tracking-tighter" id="kpi-networth">₹0</h2>
        </div>
        
        <div class="terminal-panel p-6 flex flex-col justify-center">
          <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-800 pb-1">Capital Deployed</span>
          <h2 class="text-3xl font-bold text-gray-200 tracking-tighter mt-1" id="kpi-invested">₹0</h2>
        </div>
        
        <div class="terminal-panel p-6 flex flex-col justify-center">
          <span class="text-xs text-gray-400 uppercase tracking-widest mb-2 border-b border-gray-800 pb-1">Global Alpha (ROI)</span>
          <h2 class="text-3xl font-bold tracking-tighter mt-1" id="kpi-roi">0.00%</h2>
        </div>
      </div>

      <!-- Main Chart Area -->
      <div class="terminal-panel p-6 flex-1 min-h-[350px] flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-bold glow-blue uppercase tracking-widest">Wealth Trajectory // 15YR</span>
          <div class="text-xs border border-blue-500/30 px-2 py-1 text-blue-400 bg-blue-500/10">PROJECTION MATRIX</div>
        </div>
        <div class="flex-1 relative w-full h-full">
          <canvas id="mainChart"></canvas>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: ASSET NODES & ALLOCATION -->
    <div class="lg:col-span-4 flex flex-col gap-6">
      
      <!-- Allocation Radar/Doughnut -->
      <div class="terminal-panel p-6">
        <span class="text-sm font-bold glow-green uppercase tracking-widest block mb-4">Vector Allocation</span>
        <div class="relative w-full h-[200px] flex justify-center items-center">
          <canvas id="allocChart"></canvas>
        </div>
      </div>

      <!-- Asset Data Nodes (Scrollable List) -->
      <div class="terminal-panel flex-1 flex flex-col overflow-hidden max-h-[500px]">
        <div class="p-4 border-b border-green-500/20 bg-black/40 flex justify-between items-center">
          <span class="text-sm font-bold text-gray-300 uppercase tracking-widest">Active Nodes</span>
          <span class="text-xs text-gray-500" id="asset-count">0 Detected</span>
        </div>
        
        <div class="overflow-y-auto p-2 flex-1" id="asset-list">
          <!-- Assets Injected by JS -->
        </div>
      </div>

    </div>
  </main>

  <script>
    // ============================================================================
    // CONFIGURATION & SETUP
    // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
    // ============================================================================
    const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwXU92UaymOUfanDm1SkGEHlTKzzsGxHxGn38fGNhJKjUgKemlQ9y47vd-ZA5zEIYyA/exec"; 
    
    // DEMO DATA (Used before Syncing)
    const fallbackData = [
      { Asset: "CyberDyne Systems", Category: "Tech", Invested: 150000, CurrentValue: 210000, Ticker: "CYBR", DayChangePct: 4.2 },
      { Asset: "Weyland-Yutani Corp", Category: "BioTech", Invested: 300000, CurrentValue: 285000, Ticker: "WEYL", DayChangePct: -1.5 },
      { Asset: "Stark Industries", Category: "Defense", Invested: 500000, CurrentValue: 850000, Ticker: "STRK", DayChangePct: 2.1 },
      { Asset: "Tyrell Corporation", Category: "AI", Invested: 100000, CurrentValue: 105000, Ticker: "TYRL", DayChangePct: 0.5 },
      { Asset: "Sovereign Crypto", Category: "Digital", Invested: 50000, CurrentValue: 125000, Ticker: "BTC", DayChangePct: 8.4 }
    ];

    let portfolioData = [...fallbackData];
    let mainChartInst = null;
    let allocChartInst = null;

    // Set Global Chart Settings to match Cyber-Terminal theme
    Chart.defaults.color = '#555';
    Chart.defaults.font.family = "'Space Grotesk', sans-serif";

    window.addEventListener("DOMContentLoaded", () => {
      renderDashboard();
    });

    // ============================================================================
    // GOOGLE SHEETS SYNC LOGIC
    // ============================================================================
    function handleKey(e) { if (e.key === "Enter") syncGoogleSheet(); }

    async function syncGoogleSheet() {
      const pass = document.getElementById("sheet-passcode").value.trim();
      const btn = document.getElementById("sync-btn");
      const log = document.getElementById("sys-log");
      const led = document.getElementById("sys-status-led");

      if (!pass) return alert("NO KEY ENTERED");

      // UI Loading State
      btn.innerText = "WAIT";
      btn.classList.add("animate-pulse");
      log.innerText = "SYS.STATE: ESTABLISHING UPLINK...";
      led.className = "w-3 h-3 rounded-full bg-yellow-500 animate-pulse";

      try {
        /* 
          IMPORTANT: 
          To make this work live, deploy your Google Sheet via Apps Script.
          The script should return JSON like: { assets: [{ Asset: "Name", Invested: 100, ... }] }
        */
        const response = await fetch(`${GOOGLE_SHEET_API_URL}?passcode=${encodeURIComponent(pass)}`);
        
        // If the URL is fake/fails (which it will by default until you add yours), it hits the catch block.
        if(!response.ok) throw new Error("Network response was not ok");
        
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }

        portfolioData = data.assets;
        
        // Success State
        btn.innerText = "SYNCED";
        btn.classList.remove("animate-pulse");
        btn.classList.replace("text-green-400", "text-black");
        btn.classList.replace("bg-green-500/20", "bg-green-500");
        log.innerText = "SYS.STATE: UPLINK SECURE (LIVE)";
        led.className = "w-3 h-3 rounded-full bg-green-500";
        
        renderDashboard();

      } catch (err) {
        // Fallback / Error State
        console.warn("API Call Failed. Ensuring Demo Data remains.", err);
        btn.innerText = "ERR_RETRY";
        btn.classList.remove("animate-pulse");
        btn.classList.replace("text-green-400", "text-red-500");
        log.innerText = "SYS.STATE: UPLINK FAILED // DEMO ACTIVE";
        led.className = "w-3 h-3 rounded-full bg-red-500";
        
        // Ensure we still render something
        portfolioData = [...fallbackData];
        renderDashboard();
      }
    }

    // ============================================================================
    // RENDER LOGIC
    // ============================================================================
    function renderDashboard() {
      let netWorth = 0;
      let totalInvested = 0;
      let categories = {};
      let tickerHtml = "";

      const listContainer = document.getElementById("asset-list");
      listContainer.innerHTML = "";

      // Sort by Value descending
      portfolioData.sort((a, b) => b.CurrentValue - a.CurrentValue);

      portfolioData.forEach(asset => {
        // Calculations
        netWorth += asset.CurrentValue;
        totalInvested += asset.Invested;
        categories[asset.Category] = (categories[asset.Category] || 0) + asset.CurrentValue;
        
        const profit = asset.CurrentValue - asset.Invested;
        const roiPct = asset.Invested > 0 ? (profit / asset.Invested) * 100 : 0;
        const isProfit = profit >= 0;
        const isDayProfit = asset.DayChangePct >= 0;

        // 1. Build Asset Nodes (List)
        const node = document.createElement("div");
        node.className = "asset-node p-3 mb-2 bg-black/30 border border-green-500/10 flex justify-between items-center cursor-pointer glitch-hover";
        node.innerHTML = `
          <div>
            <h4 class="text-sm font-bold text-gray-200 uppercase">${asset.Asset}</h4>
            <div class="flex gap-2 text-[10px] mt-1 tracking-widest font-mono">
              <span class="text-gray-500">${asset.Ticker}</span>
              <span class="${isDayProfit ? 'text-green-500' : 'text-red-500'}">${isDayProfit ? '+' : ''}${asset.DayChangePct.toFixed(1)}% 1D</span>
            </div>
          </div>
          <div class="text-right">
            <p class="text-sm font-bold text-white">${formatNum(asset.CurrentValue)}</p>
            <p class="text-[10px] tracking-widest font-mono ${isProfit ? 'text-green-500' : 'text-red-500'}">
              ${isProfit ? '+' : ''}${roiPct.toFixed(1)}%
            </p>
          </div>
        `;
        listContainer.appendChild(node);

        // 2. Build Ticker Tape
        tickerHtml += `
          <span class="mx-8">
            <span class="text-gray-400">${asset.Ticker}</span>
            <span class="text-white ml-2">${formatNum(asset.CurrentValue)}</span>
            <span class="${isDayProfit ? 'text-green-500' : 'text-red-500'} ml-1">
              ${isDayProfit ? '▲' : '▼'}${Math.abs(asset.DayChangePct)}%
            </span>
          </span>
        `;
      });

      // Update KPIs
      const globalROI = totalInvested > 0 ? ((netWorth - totalInvested) / totalInvested) * 100 : 0;
      document.getElementById("kpi-networth").innerText = formatNum(netWorth);
      document.getElementById("kpi-invested").innerText = formatNum(totalInvested);
      
      const roiElem = document.getElementById("kpi-roi");
      roiElem.innerText = `${globalROI >= 0 ? '+' : ''}${globalROI.toFixed(2)}%`;
      roiElem.className = `text-3xl font-bold tracking-tighter mt-1 ${globalROI >= 0 ? 'glow-green' : 'glow-red'}`;

      document.getElementById("asset-count").innerText = `${portfolioData.length} DETECTED`;
      
      // Update Ticker
      // Duplicate it so the CSS scroll is seamless
      document.getElementById("ticker-content").innerHTML = tickerHtml + tickerHtml;

      // Render Charts
      drawAllocChart(categories);
      drawProjectionChart(netWorth, globalROI);
    }

    // ============================================================================
    // CHARTING LOGIC
    // ============================================================================
    function drawAllocChart(categories) {
      const ctx = document.getElementById("allocChart").getContext("2d");
      if (allocChartInst) allocChartInst.destroy();

      const labels = Object.keys(categories);
      const data = Object.values(categories);
      
      // Cyber colors
      const bgColors = ['#00ff66', '#00e5ff', '#ff0055', '#bb00ff', '#facc15'];

      allocChartInst = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: labels,
          datasets: [{
            data: data, 
            backgroundColor: bgColors,
            borderWidth: 2,
            borderColor: '#050505',
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { position: "right", labels: { color: "#888", font: { size: 10, family: 'Space Grotesk' }, boxWidth: 10 } },
            tooltip: { backgroundColor: 'rgba(0,0,0,0.9)', titleColor: '#00ff66', bodyFont: {family: 'Space Grotesk'} }
          },
          cutout: "70%"
        }
      });
    }

    function drawProjectionChart(currentWorth, roiPct) {
      const ctx = document.getElementById("mainChart").getContext("2d");
      if (mainChartInst) mainChartInst.destroy();

      // Simple Compound Interest Math (Assuming 10k monthly injection for the simulation)
      const monthlySIP = 10000; 
      const safeRate = roiPct > 0 ? (roiPct / 100) : 0.08; // Default 8% if negative
      
      let points = [currentWorth];
      for(let y = 1; y <= 15; y++) {
        // FV = PV * (1+r)^n + PMT * [ ((1+r)^n - 1) / r ]
        const fv = currentWorth * Math.pow(1 + safeRate, y) + (monthlySIP * 12) * ((Math.pow(1 + safeRate, y) - 1) / safeRate);
        points.push(fv);
      }

      mainChartInst = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['NOW', 'Y1', 'Y2', 'Y3', 'Y4', 'Y5', 'Y6', 'Y7', 'Y8', 'Y9', 'Y10', 'Y11', 'Y12', 'Y13', 'Y14', 'Y15'],
          datasets: [{
            label: 'Projected Output',
            data: points,
            borderColor: '#00e5ff', 
            backgroundColor: 'rgba(0, 229, 255, 0.1)',
            borderWidth: 2,
            pointBackgroundColor: '#050505',
            pointBorderColor: '#00ff66',
            pointRadius: 3,
            pointHoverRadius: 6,
            fill: true,
            tension: 0.1,
            stepped: false
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { backgroundColor: 'rgba(0,0,0,0.9)', titleColor: '#00ff66', bodyFont: {family: 'Space Grotesk'}, callbacks: { label: (c) => formatNum(c.raw) } }
          },
          scales: {
            y: { grid: { color: 'rgba(0,255,102,0.05)' }, ticks: { color: '#555', callback: v => '₹' + (v/100000).toFixed(0) + 'L' } },
            x: { grid: { display: false }, ticks: { color: '#555' } }
          }
        }
      });
    }

    // Helper: Indian Rupee formatting
    function formatNum(val) {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val || 0);
    }
  </script>
</body>
</html>
